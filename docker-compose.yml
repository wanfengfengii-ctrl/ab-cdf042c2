name: quake-code-workbench

services:
  # 静态前端服务（nginx），宿主机端口可用 APP_PORT 覆盖
  app:
    build: .
    image: quake-code-workbench:latest
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

  # 一次性核验服务：代码测试 + 构建检查 + 健康地址冒烟，以退出码结束
  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: quake-code-workbench-verify:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:80
